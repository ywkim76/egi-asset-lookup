  if(a){show(a)}else{res.innerHTML='<div class="card err"><b>No asset found for "'+esc(v)+'"</b>Check the number on the label and try again, or search using the list below the search box.</div>'}
}
function render(){
  var t=q.value.trim().toUpperCase();
  var m=DATA.filter(function(d){return !t||(d.id+" "+d.cat+" "+d.loc+" "+d.pic+" "+d.mfr+" "+d.model+" "+d.sn).toUpperCase().indexOf(t)>-1});
  cnt.textContent=m.length+" / "+DATA.length+" assets";
  list.innerHTML=m.slice(0,50).map(function(d){return '<li data-id="'+esc(d.id)+'"><b>'+esc(d.id)+'</b><small>'+esc(d.cat)+(d.mfr?" · "+esc(d.mfr):"")+(d.loc?" · "+esc(d.loc):"")+'</small></li>'}).join("");
}
list.addEventListener("click",function(e){var li=e.target.closest("li");if(li){q.value=li.getAttribute("data-id");find(q.value);window.scrollTo(0,0)}});
document.getElementById("go").onclick=function(){find(q.value)};
q.addEventListener("keydown",function(e){if(e.key==="Enter")find(q.value)});
q.addEventListener("input",render);
var p=new URLSearchParams(location.search).get("asset");
if(p){q.value=p;find(p)}
render();
</script></body></html>
