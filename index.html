<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EGI Asset Lookup</title>
<style>
  :root {
    --green: #0F5132;
    --green-dark: #0b3a24;
    --tint: #E7EFEA;
    --hair: #B9C2BD;
    --text: #1A1F1C;
    --text-mute: #5B655F;
    --bg: #FFFFFF;
    --card-bg: #FFFFFF;
    --danger: #8a3b2b;
    --danger-bg: #F6E9E6;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --green: #1c7a4c;
      --green-dark: #0F5132;
      --tint: #142822;
      --hair: #33413b;
      --text: #EAEFEC;
      --text-mute: #9AA69F;
      --bg: #0f1412;
      --card-bg: #161c19;
      --danger: #e6a597;
      --danger-bg: #3a2420;
    }
  }
  :root[data-theme="dark"] {
    --green: #1c7a4c;
    --green-dark: #0F5132;
    --tint: #142822;
    --hair: #33413b;
    --text: #EAEFEC;
    --text-mute: #9AA69F;
    --bg: #0f1412;
    --card-bg: #161c19;
    --danger: #e6a597;
    --danger-bg: #3a2420;
  }
  * { box-sizing: inherit; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, "Segoe UI", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  header {
    background: var(--green);
    color: #fff;
    padding: 18px 20px calc(16px + env(safe-area-inset-top, 0px));
    padding-top: calc(18px + env(safe-area-inset-top, 0px));
  }
  header h1 {
    margin: 0;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  header p {
    margin: 4px 0 0;
    font-size: 12.5px;
    color: #cfe3d7;
  }

  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 18px 16px 48px;
  }

  .search-box {
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
  }
  .search-box input {
    flex: 1;
    min-width: 0;
    padding: 11px 12px;
    font-size: 15px;
    border: 1.5px solid var(--hair);
    border-radius: 8px;
    background: var(--card-bg);
    color: var(--text);
  }
  .search-box input:focus {
    outline: 2px solid var(--green);
    outline-offset: 1px;
  }
  .search-box button {
    padding: 11px 16px;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    background: var(--green);
    border: none;
    border-radius: 8px;
  }
  .search-box button:focus-visible,
  .suggestion:focus-visible {
    outline: 2px solid var(--green);
    outline-offset: 1px;
  }

  .suggestions {
    border: 1px solid var(--hair);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 16px;
    background: var(--card-bg);
  }
  .suggestion {
    display: block;
    width: 100%;
    text-align: left;
    padding: 9px 12px;
    font-size: 13.5px;
    border: none;
    background: none;
    color: var(--text);
    border-bottom: 1px solid var(--hair);
    cursor: pointer;
  }
  .suggestion:last-child { border-bottom: none; }
  .suggestion b { color: var(--green); }
  .suggestion span { color: var(--text-mute); margin-left: 6px; }

  .hint {
    font-size: 13px;
    color: var(--text-mute);
    margin: 0 0 16px;
    line-height: 1.5;
  }

  .card {
    border: 1px solid var(--hair);
    border-radius: 10px;
    overflow: hidden;
    background: var(--card-bg);
  }
  .card-head {
    background: var(--tint);
    padding: 14px 16px;
    border-bottom: 1px solid var(--hair);
  }
  .asset-no {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.2px;
    word-break: break-all;
  }
  .factory-line {
    font-size: 12.5px;
    color: var(--text-mute);
    margin-top: 3px;
  }
  .badge {
    display: inline-block;
    margin-top: 8px;
    padding: 2px 9px;
    border-radius: 100px;
    font-size: 11.5px;
    font-weight: 700;
  }
  .badge.active { background: #d9ead9; color: #1e5e2b; }
  .badge.inactive { background: #eee; color: #666; }
  :root[data-theme="dark"] .badge.active { background: #1c3a26; color: #8fd6a3; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .badge.active { background: #1c3a26; color: #8fd6a3; }
  }

  dl { margin: 0; }
  .row {
    display: flex;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--hair);
    font-size: 14.5px;
  }
  .row:last-child { border-bottom: none; }
  .row dt {
    flex: 0 0 108px;
    color: var(--text-mute);
    font-weight: 700;
    font-size: 12.5px;
    padding-top: 1px;
  }
  .row dd {
    margin: 0;
    flex: 1;
    min-width: 0;
    word-break: break-word;
  }
  .row dd.empty { color: var(--text-mute); }

  .not-found {
    border: 1px solid var(--danger-bg);
    background: var(--danger-bg);
    color: var(--danger);
    border-radius: 10px;
    padding: 16px;
    font-size: 14px;
    line-height: 1.55;
  }
  .not-found b { display: block; margin-bottom: 4px; font-size: 15px; }

  footer {
    max-width: 480px;
    margin: 24px auto 0;
    padding: 0 16px calc(20px + env(safe-area-inset-bottom, 0px));
    font-size: 11.5px;
    color: var(--text-mute);
    text-align: center;
  }
</style>
</head>
<body>
<header>
  <h1>EGI Asset Lookup</h1>
  <p>PT. Eagle Glove Indonesia &middot; PT. Green Gloves Indonesia</p>
</header>
<main>
  <div class="search-box">
    <input id="q" type="text" inputmode="search" autocomplete="off"
           placeholder="Enter asset number, e.g. EGI-AS-EG-OFC-001">
    <button id="go">Find</button>
  </div>
  <div id="suggestions"></div>
  <p class="hint" id="hint">Scan the QR code on an asset, or type its asset number above.</p>
  <div id="result"></div>
</main>
<footer>EGI-AS Asset Management &middot; data as of last sync</footer>

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function val(v){ return (v === null || v === undefined || v === "") ? null : v; }

function renderRow(label, value){
  const v = val(value);
  return '<div class="row"><dt>' + esc(label) + '</dt><dd class="' +
         (v ? '' : 'empty') + '">' + (v ? esc(v) : 'Not recorded') + '</dd></div>';
}

function renderAsset(d){
  const active = d.status && d.status.toLowerCase().indexOf('normal') !== -1;
  const badge = '<span class="badge ' + (active ? 'active' : 'inactive') + '">' +
                esc(d.status || 'Unknown') + '</span>';
  const kbText = d.kb === 'Y' ? 'Yes — inside bonded zone (KB)' : 'No';
  const catLabel = CAT_NAMES[d.cat] || d.cat;

  let html = '<div class="card">';
  html += '<div class="card-head"><div class="asset-no">' + esc(d.no) + '</div>';
  html += '<div class="factory-line">' + esc(FACTORY_NAMES[d.factory] || d.factory) + '</div>';
  html += badge + '</div>';
  html += '<dl>';
  html += renderRow('Category', catLabel);
  html += renderRow('Item name', d.name);
  html += renderRow('Brand', d.brand);
  html += renderRow('Model', d.model);
  html += renderRow('Serial No.', d.serial);
  html += renderRow('Purchase date', d.date);
  html += renderRow('Purchased from', d.source);
  html += renderRow('Purchase price (Rp)', d.price);
  html += renderRow('Location', d.loc);
  html += renderRow('Person in charge', d.pic);
  html += renderRow('Bonded zone (KB)', kbText);
  html += renderRow('Last service', d.service);
  html += renderRow('Notes', d.note);
  html += '</dl></div>';
  return html;
}

function renderNotFound(query){
  return '<div class="not-found"><b>No asset found for "' + esc(query) + '"</b>' +
         'Check the number on the label and try again, or search using the list below the search box.</div>';
}

function showAsset(no){
  const d = byNo[no];
  document.getElementById('hint').style.display = 'none';
  document.getElementById('suggestions').innerHTML = '';
  document.getElementById('result').innerHTML = d ? renderAsset(d) : renderNotFound(no);
}

function updateSuggestions(query){
  const box = document.getElementById('suggestions');
  const qq = query.trim().toUpperCase();
  if (qq.length < 2){ box.innerHTML = ''; return; }
  const matches = DATA.filter(function(d){
    return d.no.indexOf(qq) !== -1 || (d.name && d.name.toUpperCase().indexOf(qq) !== -1);
  }).slice(0, 8);
  if (matches.length === 0){ box.innerHTML = ''; return; }
  box.innerHTML = '<div class="suggestions">' + matches.map(function(d){
    return '<button type="button" class="suggestion" data-no="' + esc(d.no) + '">' +
           '<b>' + esc(d.no) + '</b><span>' + esc(d.name || '') + '</span></button>';
  }).join('') + '</div>';
  Array.prototype.forEach.call(box.querySelectorAll('.suggestion'), function(btn){
    btn.addEventListener('click', function(){
      document.getElementById('q').value = btn.getAttribute('data-no');
      setUrlParam(btn.getAttribute('data-no'));
      showAsset(btn.getAttribute('data-no'));
    });
  });
}

function setUrlParam(no){
  const url = new URL(window.location.href);
  url.searchParams.set('asset', no);
  window.history.replaceState({}, '', url);
}

document.getElementById('q').addEventListener('input', function(e){
  updateSuggestions(e.target.value);
});
document.getElementById('go').addEventListener('click', function(){
  const q = document.getElementById('q').value.trim().toUpperCase();
  if (!q) return;
  setUrlParam(q);
  showAsset(q);
});
document.getElementById('q').addEventListener('keydown', function(e){
  if (e.key === 'Enter'){
    document.getElementById('go').click();
  }
});

(function init(){
  const params = new URLSearchParams(window.location.search);
  const asset = params.get('asset');
  if (asset){
    document.getElementById('q').value = asset;
    showAsset(asset.toUpperCase());
  }
})();
</script>
</body>
</html>
